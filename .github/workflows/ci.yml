name: ALP CI
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @alp/web build
      - run: pnpm --filter @alp/web test:locale
      - run: pnpm --filter @alp/web exec playwright install --with-deps chromium
      - run: pnpm --filter @alp/web test:e2e
      - run: pnpm --filter @alp/indexer test:tiers
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install pinned Solidity dependencies
        working-directory: packages/contracts
        run: |
          forge install foundry-rs/forge-std@v1.9.6 --no-git --shallow
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0 --no-git --shallow
      - run: forge fmt --check
        working-directory: packages/contracts
      - run: forge test
        working-directory: packages/contracts
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
